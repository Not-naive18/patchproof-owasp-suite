name: "PatchProof Regression Verification"

on:
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  verify-python:
    name: "Python Regression Suite"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies & run pytest
        run: |
          cd benchmarks/python
          pip install -r requirements.txt
          pytest test_regression.py -v

  verify-javascript:
    name: "JavaScript/Node Regression Suite"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies & run jest/tests
        run: |
          cd benchmarks/javascript
          npm install
          npm test

  verify-golang:
    name: "Go Regression Suite"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: Run Go tests
        run: |
          cd benchmarks/golang
          go test -v ./...
